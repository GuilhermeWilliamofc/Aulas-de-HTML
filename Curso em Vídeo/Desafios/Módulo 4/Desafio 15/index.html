<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 15 - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style_media_query.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <section id="janela_login">
        <img id="imagem_login" src="images/metal.jpg" alt="Imagem de fundo do login">
        <div id="formulario">
            <h1>Login</h1>
            <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
            <form action="login.php" method="get">
                <div class="input">
                    <label for="iemail"><span class="material-icons">account_circle</span></label>
                    <input type="email" name="email" id="iemail" required placeholder="seu e-mail">
                </div>
                <br>
                <div class="input">
                    <label for="isenha"><span class="material-icons">key</span></label>
                    <input type="password" name="senha" id="isenha" required placeholder="sua senha" minlength="8">
                </div>
                <div id="validacao">
                    <input type="submit" value="Entrar">
                    <a href="esqueci_a_senha.html" id="esqueci">Esqueci a senha <span class="material-icons" style="font-size: 18px;">email</span></a>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
