<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        body{
            background-image: linear-gradient(to right, #360568, #55D6BE, #C7B8EA); /*
            to right ou 90deg...
            
            para fazer gradiente utiliza background-image e o parâmetro linear-gradient, to left para o gradiente contrário, tem como colocar quantas cores quiser no gradiente
            
            para configurar o to top e to bottom você precisa fazer uma config global:
            * {
                height: 100%;
            }
            
            asterisco é config global
                
            caso fique com problema ao scrollar a tela utilize:

            background-attachment: fixed;
            */
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
