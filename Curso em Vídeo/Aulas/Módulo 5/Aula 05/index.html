<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 05 - Flexbox</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;
            height: 300px;

            display: flex; /* vai adaptar o conteúdo, o pai deve receber essa configuração */

            justify-content: space-evenly;
            align-items: center;

            /* 
            por padrão está: 
                justify-content: flex-start;
                align-items: stretch;

            você configura o justify-content no conteiner e não nos itens, o justify-content mexe no eixo """horizontal""" (vertical no column), já o align-itens mexe no eixo """vertical""" (horizontal no column) e não é responsável por espaçamentos
            */
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
