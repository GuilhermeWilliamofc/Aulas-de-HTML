<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 06 - Flexbox centralizado</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section>
            <h1>Tela de Login</h1>
            <div id="imagem">
                <!-- Aqui vai a imagem de teste -->
            </div>
            <form method="post">
                <div class="campo">
                    <label for="iemail">Email: </label>
                    <input type="email" name="email" id="iemail" required placeholder="Seu e-mail">
                </div>

                <div class="campo">
                    <label for="isenha">Senha: </label>
                    <input type="password" name="senha" id="isenha" required placeholder="Sua senha">
                </div>

                <div class="campo">
                    <input class="botao" type="submit" value="Enviar">
                    <input class="botao" type="reset" value="Limpar">
                </div>
            </form>
        </section>
    </main>
</body>
</html>
