<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 08 - Flexbox</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;

            display: flex; /* vai adaptar o conteúdo, o pai deve receber essa configuração */
            flex-flow: row wrap;
            align-items: stretch;

            height: 400px;
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;

            /* por padrão:
                order: 0; 
            */
        }

        div#i1{
            align-self: auto;
        }
        
        div#i2{
            align-self: auto;
        }

        div#i3{
            align-self: flex-end;
        }

        div#i4{
            align-self: auto;
        }

        div#i5{
            align-self: center;
        }

        div#i6{
            align-self: flex-start;
        }

        div#i7{
            align-self: stretch;
        }

        /* por padrão:
            align-self: auto;
            ou
            align-self: inherit; (significa herdado)
        (vai herdar o align-items do pai)
        o align-self só serve para os itens não para o pai
         */
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
