<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 02 - Estudos de iframe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do
    
        <!-- Tamanho padrão 300x150-->
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" height="500"> <!--existe o parâmetro scrolling="no" que vai impedir a rolagem do site, caso coloque "yes" o iframe vai ter rolagem-->
            <a href="https://www.cursoemvideo.com/" target="_blank" rel="external">Curso em Vídeo</a>
        </iframe>

        para aprender a programar.
    </p>
    <p>
        O repositório do Guanabara

        <iframe src="https://gustavoguanabara.github.io/" frameborder="0" height="500" width="500">
            no <a href="https://gustavoguanabara.github.io/" target="_blank" rel="external"> GitHub</a>
        </iframe>

        também é bem legal!
    </p>
</body>
</html>
