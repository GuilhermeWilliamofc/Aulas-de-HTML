<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 23 - Formulário</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Exemplo de Formulário</h1>
        <form onsubmit="dados_enviados(event)" method="get" autocomplete="on">
            <fieldset> <!-- Cria uma caixa que agrupa e contorna o formulário -->
                <legend>Dados Pessoais</legend> <!-- cria um "título" pro fieldset -->
                <p>
                    <label for="inome">Nome: </label>
                    <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required autocomplete="name" placeholder="Seu Nome">
                </p>
                <p> <!-- também pode ser uma div não precisa ser p -->
                    <label for="iemail">E-mail: </label>
                    <input type="email" name="email" id="iemail" required autocomplete="email" placeholder="seuemail@email.com">
                </p>
                <p>
                    <label for="itelefone">Telefone: </label>
                    <input type="tel" name="telefone" id="itelefone" autocomplete="tel" pattern="^\(\d{2}\)[0-9]{4}-[0-9]{4}$" required placeholder="(xx)xxxx-xxxx">
                </p>
                <p id="mensagem">
                </p>
            </fieldset>
            <!-- Estudar mais sobre RegEx (Expressões Regulares) para criar os pattern -->
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar" onclick="limpar_texto()">
            </p>
        </form>
    </main>
</body>
<script src="js/script.js"></script>
</html>
