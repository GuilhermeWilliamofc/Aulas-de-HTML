<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 28 - Media Query</title>
    <link rel="stylesheet" href="css/style.css" media="all"> <!-- all é para todo tipo de media -->
    <link rel="stylesheet" href="css/style_retrato.css" media="screen and (orientation: portrait)"> <!-- todas as telas no modo retrato (em pé), media types não tem parênteses, media features são indicados entre parênteses isoladamente -->
    <link rel="stylesheet" href="css/style_paisagem.css" media="screen and (orientation: landscape)"> <!-- todas as telas no modo paisagem (deitado) -->
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
</body>
</html>
