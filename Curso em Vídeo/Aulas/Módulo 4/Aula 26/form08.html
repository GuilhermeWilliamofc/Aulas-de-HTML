<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 26 - Formulário</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Exemplo de Formulário</h1>
        <hr>
        <form method="post" autocomplete="on">
            <p> <!-- é mais comum utilizar div ao invés de p -->
                <label for="iestado">Estado: </label>
                <select name="estado" id="iestado"> <!-- aparece uma caixinha e quando clica tem as opções -->
                    <option value="" selected>--- Escolha ---</option>
                    <optgroup label="Região Sudeste"> <!-- serve para agrupar as opções por "categoria" -->
                        <option value="MG">Minas Gerais</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="SP">São Paulo</option>
                    </optgroup>
                    <!-- selected para deixar marcado como padrão -->
                    <optgroup label="Região Nordeste">
                        <option value="MA">Maranhão</option>
                        <option value="PE">Pernambuco</option>
                        <option value="RN">Rio Grande do Norte</option>
                    </optgroup>
                </select>
            </p>
            <p>
                <label for="iprofissao">Profissão: </label>
                <input type="text" name="profissao" id="iprofissao" list="lista_profissao">
                <datalist id="lista_profissao">
                    <option>Administrador</option>
                    <option>Contabilista</option>
                    <option>Desenvolvedor</option>
                    <option>Professor</option>
                </datalist>
            </p>
            <p>
                <label for="imensagem">Mensagem: </label>
                <br>
                <textarea name="mensagem" id="imensagem" cols="30" rows="10" placeholder="Sua mensagem aqui..." style="resize: none;"></textarea>
                <!-- ao utilizar textarea usa o metodo post, resize none para evitar do usuário mexer no tamanho da caixa -->
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </form>
    </main>
</body>
</html>
