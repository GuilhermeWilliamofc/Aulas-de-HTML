<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 27 - Formulário</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Exemplo de Formulário</h1>
        <hr>
        <form method="get" autocomplete="on">
            <p>
                <label for="iano">Em que ano você nasceu? </label>
                <input type="number" name="ano" id="iano" min="1900" value="2000" oninput="calcular_idade()">
            </p>

            <p>
                <label for="iidade">Sua idade é: </label>
                <span id="iidade">0</span>
            </p>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar" onclick="limpar_texto()">
            </p>
        </form>
    </main>
</body>
<script src="js/script3.js"></script>
</html>
