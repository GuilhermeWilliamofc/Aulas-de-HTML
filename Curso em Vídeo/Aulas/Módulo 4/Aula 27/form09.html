<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 27 - Formulário</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Exemplo de Formulário</h1>
        <hr>
        <form method="get" autocomplete="on">
            <p>
                <label for="inum1">Número 1: </label>
                <input type="number" name="num1" id="inum1" min="0" max="50" required placeholder="Digite um número" oninput="soma()">
            </p>

            <p>
                <label for="inum2">Número 2: </label>
                <input type="number" name="num2" id="inum2" min="0" max="50" required placeholder="Digite outro número" oninput="soma()">
            </p>

            <p>
                <label for="isoma">Soma: </label>
                <span id="isoma">0</span>
                <!-- <output name="soma" id="isoma">0</output> -->
                <!-- output é só para mostrar na tela, nos meus tester o output estava impedindo o js externo de funcionar então troquei pela tag span -->
            </p>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar" onclick="limpar_texto()">
            </p>
        </form>
    </main>
</body>
<script src="js/script.js"></script>
</html>
